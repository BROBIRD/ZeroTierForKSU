name: dev build

on:
  workflow_dispatch:
    inputs:
      zt_version:
        description: "zt标签/Tag"
        required: false
        type: string
        default: ""
      ui_path:
        description: "UI Path"
        required: true
        default: "ui-new"
        type: choice
        options:
          - ui-new
          - ui-src
      toolchain:
        description: "Toolchain"
        required: true
        default: "gcc"
        type: choice
        options:
          - gcc
          - ndk
      manual_release:
        description: "发布 Release / Publish Release"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "发版内容 / Release Notes (留空则使用最新 commit)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Determine versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      module_version: ${{ steps.set_version.outputs.module_version }}
      release_notes: ${{ steps.set_notes.outputs.notes }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Determine Versions
        id: set_version
        run: |
          zerotier_latest_version="${{ inputs.zt_version }}"
          if [ -z "$zerotier_latest_version" ]; then
            zerotier_latest_version=$(gh api repos/zerotier/ZeroTierOne/releases/latest --jq .tag_name)
          fi
          versionCode=$(expr 10000 + $(git rev-list --count HEAD) + 200)
          echo "version=${zerotier_latest_version}" >> $GITHUB_OUTPUT
          echo "module_version=${versionCode}" >> $GITHUB_OUTPUT
          echo "Building ZeroTier ${zerotier_latest_version} with versionCode ${versionCode}"

      - name: Determine release notes
        id: set_notes
        run: |
          if [ -n "${{ inputs.release_notes }}" ]; then
            printf '%s' "${{ inputs.release_notes }}" > notes.txt
          else
            git log -1 --pretty=%B > notes.txt
          fi
          {
            echo 'notes<<EOF'
            cat notes.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  ui:
    name: Build UI
    uses: ./.github/workflows/build-ui.yml
    with:
      ui_path: ${{ inputs.ui_path || 'ui-new' }}

  gcc:
    name: Build GCC binaries
    if: ${{ inputs.toolchain != 'ndk' }}
    uses: ./.github/workflows/build-gcc.yml
    with:
      zt_version: ${{ needs.prepare.outputs.version }}
      sso: false
    needs: [prepare]

  ndk:
    name: Build NDK binaries
    if: ${{ inputs.toolchain == 'ndk' }}
    uses: ./.github/workflows/build-ndk.yml
    with:
      zt_version: ${{ needs.prepare.outputs.version }}
      sso: false
    needs: [prepare]

  package:
    name: Package (dev)
    needs: [prepare, ui, gcc, ndk]
    if: always() && needs.prepare.result == 'success' && needs.ui.result == 'success' && (needs.gcc.result == 'success' || needs.ndk.result == 'success')
    uses: ./.github/workflows/package.yml
    with:
      zt_version: ${{ needs.prepare.outputs.version }}
      module_version: ${{ needs.prepare.outputs.module_version }}
      ui_path: ${{ inputs.ui_path || 'ui-new' }}
      sso: false
      release: ${{ inputs.manual_release == true }}
      release_tag: ${{ needs.prepare.outputs.module_version }}
      release_name: ZeroTierForKSU-dev-${{ needs.prepare.outputs.module_version }}
      prerelease: true
      changelog: ${{ needs.prepare.outputs.release_notes }}
      update_branch: ${{ github.ref_name }}
      dev: true

  dev-json:
    name: Generate dev updater jsons
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate dev updater manifests
        env:
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          MODULE_VERSION="${{ needs.prepare.outputs.module_version }}"
          TOOLCHAIN="${{ inputs.toolchain != 'ndk' && 'GCC' || 'NDK' }}"
          if [ "${{ inputs.manual_release }}" = "true" ]; then
            BASE_URL="https://github.com/${{ github.repository }}/releases/download/${MODULE_VERSION}"
            CHANGELOG_URL="${BASE_URL}/changelog_dev.md"
          else
            BASE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/changelog_dev.md"
          fi
          printf '{"version":"%s","versionCode":%s,"zipUrl":"%s/ZeroTierForKSU-%s-arm64-%s.zip","changelog":"%s"}\n' \
            "$VERSION" "$MODULE_VERSION" "$BASE_URL" "$TOOLCHAIN" "$MODULE_VERSION" "$CHANGELOG_URL" > update_arm64_dev.json
          printf '{"version":"%s","versionCode":%s,"zipUrl":"%s/ZeroTierForKSU-%s-arm-%s.zip","changelog":"%s"}\n' \
            "$VERSION" "$MODULE_VERSION" "$BASE_URL" "$TOOLCHAIN" "$MODULE_VERSION" "$CHANGELOG_URL" > update_arm_dev.json

          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            printf '%s\n' "$INPUT_RELEASE_NOTES" > changelog_dev.md
          else
            printf '%s\n' "${{ needs.prepare.outputs.release_notes }}" > changelog_dev.md
          fi
          cat update_arm64_dev.json update_arm_dev.json

      - name: Upload dev manifests
        uses: actions/upload-artifact@v4
        with:
          name: dev-manifests-${{ needs.prepare.outputs.module_version }}
          path: |
            update_arm64_dev.json
            update_arm_dev.json
            changelog_dev.md
          retention-days: 7

      - name: Attach dev manifests to release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.manual_release }}
        with:
          prerelease: true
          tag_name: ${{ needs.prepare.outputs.module_version }}
          files: |
            update_arm64_dev.json
            update_arm_dev.json
            changelog_dev.md
