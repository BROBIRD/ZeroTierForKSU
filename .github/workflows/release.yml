name: release
# Scheduled auto-release: builds a new module release whenever zerotier/ZeroTierOne
# publishes a new tag. Produces GCC + NDK module zips (arm64/arm, plus arm64 SSO).

on:
  workflow_dispatch:
    inputs:
      zt_version:
        description: "ZeroTier tag (empty = latest release)"
        required: false
        type: string
        default: ""
      ui_path:
        description: "UI Path"
        required: true
        default: "ui-new"
        type: choice
        options:
          - ui-new
          - ui-src
      sso:
        description: "Build arm64 SSO (zeroidc) variants"
        required: false
        type: boolean
        default: true
      update_branch:
        description: "Branch that hosts the updater json files (default: the branch this workflow runs on)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "40 15 * * *"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare versions & updater manifests
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
      version: ${{ steps.meta.outputs.version }}
      module_version: ${{ steps.meta.outputs.module_version }}
      changelog: ${{ steps.changelog.outputs.body }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Determine versions
        id: meta
        run: |
          zerotier_latest_version="${{ inputs.zt_version }}"
          if [ -z "$zerotier_latest_version" ]; then
            zerotier_latest_version=$(gh api repos/zerotier/ZeroTierOne/releases/latest --jq .tag_name)
          fi
          if [ -z "$zerotier_latest_version" ] || [ "$zerotier_latest_version" = "null" ]; then
            echo "::error::could not resolve the latest ZeroTierOne release tag"
            exit 1
          fi
          zerotier_version=$(cat zerotier_version)
          echo "${zerotier_version}=${zerotier_latest_version}"

          skip=false
          if [ "$zerotier_latest_version" = "$zerotier_version" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            skip=true
          fi
          versionCode=$(expr 10000 + $(git rev-list --count HEAD) + 200)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "version=$zerotier_latest_version" >> "$GITHUB_OUTPUT"
          echo "module_version=$versionCode" >> "$GITHUB_OUTPUT"

      - name: Update versionCode & updater manifests
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          versionCode="${{ steps.meta.outputs.module_version }}"
          CHANGELOG_URL="https://raw.githubusercontent.com/BROBIRD/ZeroTierForKSU/${{ github.ref_name }}/changelog.md"
          REPO_URL="https://github.com/BROBIRD/ZeroTierForKSU/releases/download/${versionCode}"

          write_json() {
            printf '{"version":"%s","versionCode":%s,"zipUrl":"%s/ZeroTierForKSU-%s-%s.zip","changelog":"%s"}\n' \
              "$VERSION" "$versionCode" "$REPO_URL" "$1" "$versionCode" "$CHANGELOG_URL" > "$2"
          }

          write_json "GCC-arm64"    update_arm64.json
          write_json "GCC-arm"      update_arm.json
          write_json "GCC-arm64-SSO" update_arm64-sso.json
          write_json "NDK-arm64"    update_arm64-ndk.json
          write_json "NDK-arm"      update_arm-ndk.json
          write_json "NDK-arm64-SSO" update_arm64-ndk-sso.json

          git config --global user.email "action@example.com"
          git config --global user.name "github action"
          MESSAGE=$(git log -1 --pretty=%B)
          echo "commit MESSAGE: $MESSAGE"
          echo "${{ steps.meta.outputs.version }}" > zerotier_version
          git add zerotier_version update_arm64.json update_arm.json update_arm64-sso.json update_arm64-ndk.json update_arm-ndk.json update_arm64-ndk-sso.json changelog.md
          git commit -m "update config" || echo "nothing to commit"

      - name: Generate changelog
        id: changelog
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          wget -qO RELEASE-NOTES.md https://github.com/zerotier/ZeroTierOne/raw/dev/RELEASE-NOTES.md
          # extract the notes for the released version (first entry)
          {
            echo '## Module Changelog'
            echo "$MESSAGE"
            echo ''
            echo '## Zerotier Changelog'
            start=$(grep -nPo '\d{4}-\d{2}-\d{2} -- Version [\d.]+' RELEASE-NOTES.md | head -1 | cut -d ':' -f1)
            end=$(grep -nPo '\d{4}-\d{2}-\d{2} -- Version [\d.]+' RELEASE-NOTES.md | head -2 | tail -1 | cut -d ':' -f1)
            if [ -n "$end" ]; then end=$((end - 1)); else end=$(wc -l < RELEASE-NOTES.md); fi
            sed -n "${start},${end}p" RELEASE-NOTES.md
          } > changelog.md
          rm RELEASE-NOTES.md
          cat changelog.md
          {
            echo 'body<<EOF'
            cat changelog.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          git add changelog.md
          git commit -m "update changelog" || echo "nothing to commit"

      - name: Push changes
        if: ${{ steps.meta.outputs.skip != 'true' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

  ui:
    name: Build UI
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    uses: ./.github/workflows/build-ui.yml
    with:
      ui_path: ${{ inputs.ui_path || 'ui-new' }}

  gcc:
    name: Build GCC binaries
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    uses: ./.github/workflows/build-gcc.yml
    with:
      zt_version: ${{ needs.prepare.outputs.version }}
      sso: ${{ inputs.sso != false }}

  ndk:
    name: Build NDK binaries
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    uses: ./.github/workflows/build-ndk.yml
    with:
      zt_version: ${{ needs.prepare.outputs.version }}
      sso: ${{ inputs.sso != false }}

  package:
    name: Package & release
    needs: [prepare, ui, gcc, ndk]
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    uses: ./.github/workflows/package.yml
    with:
      zt_version: ${{ needs.prepare.outputs.version }}
      module_version: ${{ needs.prepare.outputs.module_version }}
      ui_path: ${{ inputs.ui_path || 'ui-new' }}
      sso: ${{ inputs.sso != false }}
      release: true
      release_tag: ${{ needs.prepare.outputs.module_version }}
      release_name: ZeroTierForKSU-${{ needs.prepare.outputs.module_version }}
      changelog: ${{ needs.prepare.outputs.changelog }}
      update_branch: ${{ inputs.update_branch || github.ref_name }}
